name: release

# Publishes to PyPI when a v* tag is pushed, then creates the GitHub release. PyPI uses trusted publishing
# (OIDC): no token is stored anywhere. One-time setup on PyPI: add a pending publisher for project "unpick",
# owner amberb617, repository unpick, workflow release.yml, environment pypi.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - name: Tag must match the package version
        run: |
          v=$(python -c "import unpick; print(unpick.__version__)")
          test "v$v" = "${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1

  github-release:
    # After PyPI, so the release page never names a version PyPI does not have. Skips a tag that already
    # has a release, so a hand-written one is never overwritten.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: GitHub release, notes generated from the merged pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && exit 0
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "unpick ${GITHUB_REF_NAME#v}" --generate-notes
