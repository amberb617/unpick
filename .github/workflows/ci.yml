name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check unpick tests
      - run: python -m pytest -q
      # Dogfood: the repository must scan clean with its own recorded decisions.
      - run: unpick scan . --no-color
      # The demo kit must pass once its planted findings are accepted.
      - run: unpick scan demo --decisions demo/accepted.decisions.json --no-color
      - name: PowerShell demo (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:RT_BACKENDS = ''
          '' | powershell -NoProfile -File demo/run.ps1

  ui-screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,uitest]"
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q tests/test_ui_playwright.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-screenshots
          path: docs/screenshots/ui/

  handout-commands:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - if: runner.os != 'Windows'
        run: sh tests/handout/handout.sh demo/sample-a | tee handout-${{ runner.os }}.txt
      - if: runner.os == 'Windows'
        shell: powershell
        run: powershell -NoProfile -File tests/handout/handout.ps1 demo/sample-a | Tee-Object handout-windows-ps51.txt
      - if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File tests/handout/handout.ps1 demo/sample-a | Tee-Object handout-windows-ps7.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: handout-${{ runner.os }}
          path: handout-*.txt
